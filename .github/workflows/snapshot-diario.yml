# Snapshot diario del mercado (paso 9).
#
# Vive en GitHub Actions y no en Render porque el plan gratuito de Render no incluye
# cron jobs. Ver design.md §Estrategia de deploy.
#
# CUATRO DISPAROS, por dos motivos distintos:
#
# 1. MADRUGADA (tras el cambio de valor de las 00:00 en LaLiga Fantasy). Es cuando
#    futbolfantasy recalcula tendencias, así que es el momento de refrescar la analítica.
#    Sin esto, por la mañana se veía el valor nuevo junto a una tendencia del día anterior.
#      23:30 UTC -> 01:30 CEST (verano) / 00:30 CET (invierno)
#      01:00 UTC -> 03:00 CEST (verano) / 02:00 CET (invierno)
#
# 2. TARDE (tras el cierre de mercado de las 18:00). Es cuando se guarda el snapshot.
#      16:30 UTC -> 18:30 CEST (verano, guarda) / 17:30 CET (invierno, aún no)
#      17:30 UTC -> 19:30 CEST (verano, ya existe) / 18:30 CET (invierno, guarda)
#
# El doble disparo de cada bloque cubre el cambio CET/CEST: el cron se define en UTC y
# España cambia de hora dos veces al año, así que una sola hora se desfasaría media
# temporada.
#
# Ningún disparo de más hace daño: la analítica se guarda con upsert (refrescarla varias
# veces solo mejora la frescura) y el snapshot de mercado tiene guardia horaria y no se
# recaptura si ya existe.
#
# AVISO: GitHub Actions retrasa los crons cuando hay carga; se han observado retrasos de
# hasta 2 horas. Por eso el script decide qué hacer mirando la hora REAL de Madrid, no
# confiando en la hora programada.
name: Snapshot diario del mercado

on:
  schedule:
    # Madrugada: refresca la analítica con los valores nuevos.
    - cron: "30 23 * * *"
    - cron: "0 1 * * *"
    # Tarde: guarda el snapshot del mercado tras el cierre.
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  # Si los dos disparos se solaparan, el segundo espera en vez de competir por la BD.
  group: snapshot-diario
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # el scraping es serial y espaciado: tarda minutos, no horas
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar el snapshot
        env:
          # Secrets del repositorio: nunca aparecen en el log ni en el código.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FANTASY_ENTORNO: produccion
          FANTASY_CONTACTO: mailto:nicolas.rdguezgomez@gmail.com
        run: uv run python scripts/snapshot_diario.py
