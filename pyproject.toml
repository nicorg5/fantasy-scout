[project]
name = "fantasy-scout"
version = "0.1.0"
description = "Analítica de plantilla y mercado para una liga privada de LaLiga Fantasy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "passlib[argon2]>=1.7",
    "cryptography>=43.0",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
